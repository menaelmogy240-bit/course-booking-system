<div class="container">
    <h1>Course Booking</h1>
    <label for="">student Name</label>
    <input type="text" placeholder="  Enter your name" required>
    <label for="">Email</label>
    <input type="email" placeholder="  Enter your email" required>
    <label for="">Age</label>
    <input type="number" required>
    <label for="">Booking Date</label>
    <input type="date" required>
    <label for="">Select Course</label>
    <select required>
    <option value="">choose course</option>  
    </select>
    <label class="shift-label">choose shift:</label>
    <div class="radio-group">
        <input type="radio" id="morning" name="shift" value="morning">
        <label for="morning">morning</label>

          <input type="radio" id="evening" name="shift" value="evening">
        <label for="evening">evening</label>

    </div>
    <div class="checkbox-group">
        <input type="checkbox" id="confirm" required>
        <label for="confirm">I confirm my booking information</label>
    </div>

    <label for="file">upload student file</label>
    <input type="file" id="file">
    <label for="notes">notes</label>
    <textarea id="notes" placeholder="write your notes here" rows="4"></textarea>
    <button type="submit" class="submit-btn">Book Now</button>
    
    









</div>
